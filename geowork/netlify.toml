# Set "Base directory" to geowork in the Netlify project configuration
# when deploying from offych-git/desktop.
[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
