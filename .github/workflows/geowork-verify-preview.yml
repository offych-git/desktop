name: Verify GeoWork Netlify temporary preview
on:
  push:
    paths:
      - ".github/workflows/geowork-verify-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect access and verify password-protected preview
        run: |
          set -euo pipefail
          URL="https://magnificent-nougat-e1d040.netlify.app"
          curl -sS -D /tmp/geowork-headers -o /tmp/geowork-page -w "Unauthenticated HTTP %{http_code}\n" "$URL"
          echo "Relevant response headers:"
          grep -Ei 'HTTP/|WWW-Authenticate:|content-type:' /tmp/geowork-headers || true
          for identity in ":My-Drop-Site" "netlify:My-Drop-Site" "admin:My-Drop-Site"; do
            status=$(curl -sS -L -u "$identity" -o /tmp/geowork-authed -w "%{http_code}" "$URL")
            echo "Authenticated check: HTTP $status"
            if [ "$status" = "200" ] && grep -qi "GeoWork" /tmp/geowork-authed; then
              echo "GeoWork homepage is live and accessible using Netlify's supplied anonymous password."
              exit 0
            fi
          done
          echo "No tested Basic Auth combination reached GeoWork."
          exit 1
