name: Provision standalone GeoWork editorial CMS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create unclaimed Sanity project, no GitHub credentials
        run: |
          mkdir -p "$RUNNER_TEMP/geowork-san"
          cd "$RUNNER_TEMP/geowork-san"
          npx --yes sanity@latest new "GeoWork Editorial CMS" --yes --no-scaffold --json > "$RUNNER_TEMP/sanity-project.json"
      - name: Report safe project details for project ownership handoff
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/sanity-project.json','utf8');
          const data = JSON.parse(raw);
          console.log('Sanity project structure keys:', Object.keys(data).join(', '));
          function crawl(value, prefix='') {
            if (!value || typeof value!=='object') return;
            for (const [key,v] of Object.entries(value)) {
              const p=prefix?prefix+'.'+key:key;
              if (typeof v === 'string' && /project.?id|claim.?url|claim.?link|dataset/i.test(key)) console.log(p+': '+v);
              else if(v && typeof v==='object') crawl(v,p);
            }
          }
          crawl(data);
          NODE
