name: Inspect Netlify anonymous preview protection
on:
  push:
    paths:
      - ".github/workflows/geowork-verify-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect 401 login page
        run: |
          set -euo pipefail
          curl -sSL -D /tmp/geowork-headers -o /tmp/geowork-body -w "HTTP %{http_code}\n" "https://magnificent-nougat-e1d040.netlify.app/"
          echo "Headers:"
          sed -n '1,40p' /tmp/geowork-headers
          echo "Body first 2700 characters:"
          head -c 2700 /tmp/geowork-body
          echo
