name: GeoWork Astro build
on:
  push:
    paths:
      - "geowork/**"
      - ".github/workflows/geowork-build.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geowork
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Test first-party CMS security helpers
        run: npm run test:cms
      - name: Build Astro website and editor
        run: npm run build
      - name: Verify editor was bundled
        run: test -f dist/admin/index.html && test -f dist/admin-geowork.js
